server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # /api/animals -> http://server-a:3001/animals
  location /api/ {
    proxy_pass http://server-a:3001/;
    proxy_set_header Host $host;
    proxy_set_header Content-Type $http_content_type;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
